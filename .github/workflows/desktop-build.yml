name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create a GitHub release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always
  APP_NAME: AIGoodbye

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install pyinstaller

      - name: Generate placeholder icons
        run: python desktop/scripts/generate-icons.py

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle Python backend
        working-directory: desktop
        run: npm run bundle:python

      - name: Build Tauri
        working-directory: desktop
        run: npm run build:windows

      - name: Rename and organize artifacts
        shell: pwsh
        run: |
          $version = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          $outputDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outputDir

          # Find and rename the NSIS installer
          $nsisFiles = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsisFiles) {
            Copy-Item $nsisFiles[0].FullName "$outputDir/${{ env.APP_NAME }}-Windows-Setup.exe"
          }

          # Find and rename the MSI installer
          $msiFiles = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Copy-Item $msiFiles[0].FullName "$outputDir/${{ env.APP_NAME }}-Windows.msi"
          }

          Get-ChildItem $outputDir

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts/*

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            artifact_suffix: arm64
          # Use macos-13 for Intel builds - macos-14 is ARM64 (Apple Silicon)
          # PyInstaller cannot cross-compile, so we need an actual Intel runner
          - runner: macos-13
            arch: x64
            target: x86_64-apple-darwin
            artifact_suffix: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python dependencies
        run: |
          pip install pyinstaller

      - name: Generate placeholder icons
        run: python desktop/scripts/generate-icons.py

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle Python backend
        working-directory: desktop
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npm run bundle:python

      - name: Build Tauri
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }}

      - name: Rename and organize artifacts
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          OUTPUT_DIR="release-artifacts"
          mkdir -p $OUTPUT_DIR

          # Find and rename DMG file
          DMG=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$OUTPUT_DIR/${{ env.APP_NAME }}-macOS-${{ matrix.artifact_suffix }}.dmg"
          fi

          # Fallback to release directory
          RELEASE_DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$RELEASE_DMG" ] && [ ! -f "$OUTPUT_DIR/${{ env.APP_NAME }}-macOS-${{ matrix.artifact_suffix }}.dmg" ]; then
            cp "$RELEASE_DMG" "$OUTPUT_DIR/${{ env.APP_NAME }}-macOS-${{ matrix.artifact_suffix }}.dmg"
          fi

          ls -la $OUTPUT_DIR

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.artifact_suffix }}
          path: release-artifacts/*

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AI Goodbye v${{ steps.version.outputs.version }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | macOS | Apple Silicon | [AIGoodbye-macOS-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-macOS-arm64.dmg) |
            | macOS | Intel | [AIGoodbye-macOS-x64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-macOS-x64.dmg) |
            | Windows | 64-bit | [AIGoodbye-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-Windows-Setup.exe) |

            ## Installation

            **macOS:** Download the DMG file for your Mac type, open it, and drag AI Goodbye to your Applications folder.

            **Windows:** Download the Setup.exe and run the installer.

            ## What's New
