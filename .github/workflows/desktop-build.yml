name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create a GitHub release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always
  APP_NAME: AIGoodbye
  OLLAMA_VERSION: "0.14.2"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install pyinstaller pillow

      - name: Generate app icons
        run: python desktop/scripts/generate-icons.py

      - name: Download Ollama for Windows
        shell: pwsh
        run: |
          $ollamaUrl = "https://github.com/ollama/ollama/releases/download/v${{ env.OLLAMA_VERSION }}/ollama-windows-amd64.zip"
          $ollamaZip = Join-Path $env:RUNNER_TEMP "ollama.zip"
          $ollamaDir = "desktop\src-tauri\binaries"
          $extractDir = Join-Path $env:RUNNER_TEMP "ollama-extract"

          Write-Host "Downloading Ollama from $ollamaUrl"
          Invoke-WebRequest -Uri $ollamaUrl -OutFile $ollamaZip

          Write-Host "Creating directories..."
          New-Item -ItemType Directory -Force -Path $ollamaDir | Out-Null
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Write-Host "Extracting to $extractDir"
          Expand-Archive -Path $ollamaZip -DestinationPath $extractDir -Force

          Write-Host "Extracted contents:"
          Get-ChildItem -Recurse $extractDir | ForEach-Object { Write-Host $_.FullName }

          # Find ollama.exe - it might be in root or a subdirectory
          $ollamaExe = Get-ChildItem -Path $extractDir -Filter "ollama.exe" -Recurse | Select-Object -First 1

          if ($ollamaExe) {
            $targetPath = Join-Path $ollamaDir "ollama-x86_64-pc-windows-msvc.exe"
            Write-Host "Found ollama.exe at: $($ollamaExe.FullName)"
            Write-Host "Copying to: $targetPath"
            Copy-Item $ollamaExe.FullName $targetPath -Force

            # Verify copy succeeded
            if (Test-Path $targetPath) {
              Write-Host "SUCCESS: Ollama binary copied successfully"
              $fileInfo = Get-Item $targetPath
              Write-Host "File size: $($fileInfo.Length) bytes"
            } else {
              Write-Host "ERROR: Failed to copy ollama.exe"
              exit 1
            }
          } else {
            Write-Host "ERROR: ollama.exe not found in extracted files!"
            exit 1
          }

          # Copy only CPU libraries for the main installer (keeps size manageable for NSIS)
          # GPU libraries will be available as a separate download that the app fetches on demand
          # New Ollama structure: lib/ollama/ contains DLLs directly, GPU libs in subdirs
          $libSource = Get-ChildItem -Path $extractDir -Filter "lib" -Directory -Recurse | Select-Object -First 1
          if ($libSource) {
            $ollamaLibSource = Join-Path $libSource.FullName "ollama"

            # Place lib folder at src-tauri root level for simpler resource bundling
            $ollamaLibTarget = "desktop\src-tauri\lib\ollama"

            Write-Host "Found Ollama lib at: $ollamaLibSource"
            New-Item -ItemType Directory -Force -Path $ollamaLibTarget | Out-Null

            # Copy base and CPU DLLs (ggml-base.dll, ggml-cpu-*.dll)
            Get-ChildItem -Path $ollamaLibSource -Filter "*.dll" -File | ForEach-Object {
              Write-Host "Copying CPU library: $($_.Name)"
              Copy-Item -Path $_.FullName -Destination $ollamaLibTarget -Force
            }

            # Create GPU runners package for separate download (cuda_*, vulkan folders)
            $gpuPackageDir = Join-Path $env:RUNNER_TEMP "gpu-runners"
            New-Item -ItemType Directory -Force -Path $gpuPackageDir | Out-Null

            Get-ChildItem -Path $ollamaLibSource -Directory | Where-Object {
              $_.Name -like "cuda*" -or $_.Name -like "rocm*" -or $_.Name -like "vulkan*"
            } | ForEach-Object {
              Write-Host "Packaging GPU library: $($_.Name)"
              Copy-Item -Path $_.FullName -Destination (Join-Path $gpuPackageDir $_.Name) -Recurse -Force
            }

            # Create zip of GPU runners
            $gpuZipPath = "desktop\src-tauri\gpu-runners.zip"
            Compress-Archive -Path "$gpuPackageDir\*" -DestinationPath $gpuZipPath -Force
            Write-Host "Created GPU runners package: $gpuZipPath"
            $gpuZipSize = [math]::Round((Get-Item $gpuZipPath).Length / 1MB, 2)
            Write-Host "GPU package size: ${gpuZipSize}MB"

            # Show what was bundled
            Write-Host "CPU libraries bundled:"
            Get-ChildItem $ollamaLibTarget -File | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name) - ${sizeMB}MB"
            }
          } else {
            Write-Host "WARNING: lib folder not found - Ollama may not work correctly!"
          }

          Write-Host "Final binaries directory contents:"
          Get-ChildItem $ollamaDir | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle Python backend
        working-directory: desktop
        run: npm run bundle:python

      - name: Build Tauri
        working-directory: desktop
        run: npm run build:windows

      - name: Rename and organize artifacts
        shell: pwsh
        run: |
          $version = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          $outputDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outputDir

          # When building with --target, artifacts are in target/{target}/release/bundle/
          $targetDir = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $fallbackDir = "desktop/src-tauri/target/release/bundle"

          # Find and rename the NSIS installer
          $nsisFiles = Get-ChildItem -Path "$targetDir/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsisFiles) {
            $nsisFiles = Get-ChildItem -Path "$fallbackDir/nsis/*.exe" -ErrorAction SilentlyContinue
          }
          if ($nsisFiles) {
            Copy-Item $nsisFiles[0].FullName "$outputDir/${{ env.APP_NAME }}-Windows-Setup.exe"
            Write-Host "Copied NSIS installer: $($nsisFiles[0].FullName)"
          } else {
            Write-Host "Warning: No NSIS installer found"
          }

          # Copy GPU runners package for separate download
          $gpuZipPath = "desktop/src-tauri/gpu-runners.zip"
          if (Test-Path $gpuZipPath) {
            Copy-Item $gpuZipPath "$outputDir/${{ env.APP_NAME }}-GPU-Runners.zip"
            Write-Host "Copied GPU runners package"
          }

          Write-Host "Release artifacts:"
          Get-ChildItem $outputDir

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts/*

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            artifact_suffix: arm64
            ollama_arch: arm64
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            artifact_suffix: x64
            ollama_arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove unnecessary tools and caches to free space
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /Library/Developer/CommandLineTools/SDKs || true
          sudo rm -rf /Applications/Xcode_14*.app || true
          sudo rm -rf /Applications/Xcode_15.0*.app || true

          # Remove homebrew cache and unnecessary packages
          brew cleanup -s 2>/dev/null || true
          rm -rf ~/Library/Caches/Homebrew || true

          # Remove other large directories
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          # Note: Do NOT remove ~/.rustup/toolchains/*/share/doc - breaks rustup updates

          echo "Disk space after cleanup:"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python dependencies
        run: |
          pip install pyinstaller pillow

      - name: Generate app icons
        run: python desktop/scripts/generate-icons.py

      - name: Download Ollama for macOS
        run: |
          OLLAMA_URL="https://github.com/ollama/ollama/releases/download/v${{ env.OLLAMA_VERSION }}/ollama-darwin.tgz"
          OLLAMA_DIR="desktop/src-tauri/binaries"

          echo "Downloading Ollama from $OLLAMA_URL"
          mkdir -p $OLLAMA_DIR

          # Download and extract the tgz archive
          curl -L -o /tmp/ollama-darwin.tgz "$OLLAMA_URL"
          tar -xzf /tmp/ollama-darwin.tgz -C /tmp

          # Move the ollama binary to the binaries directory with correct name
          mv /tmp/ollama "$OLLAMA_DIR/ollama-${{ matrix.target }}"
          chmod +x "$OLLAMA_DIR/ollama-${{ matrix.target }}"

          echo "Ollama binary ready:"
          ls -la $OLLAMA_DIR

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle Python backend
        working-directory: desktop
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npm run bundle:python

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate is installed
          echo "Installed certificates:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Export keychain path for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build Tauri
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }}

      - name: Clean up build artifacts to free space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large intermediate build artifacts, keeping only the bundle
          cd desktop/src-tauri/target/${{ matrix.target }}/release
          # Keep bundle directory, remove everything else
          find . -maxdepth 1 -type f -name "*.d" -delete || true
          find . -maxdepth 1 -type f -name "*.rlib" -delete || true
          rm -rf deps || true
          rm -rf build || true
          rm -rf incremental || true
          rm -rf .fingerprint || true

          # Go back to root
          cd $GITHUB_WORKSPACE

          # Remove node_modules (no longer needed after build)
          rm -rf desktop/node_modules || true

          # Remove npm cache
          npm cache clean --force || true

          # Remove Python cache and pip cache
          rm -rf ~/.cache/pip || true
          pip cache purge || true

          # Remove the downloaded Ollama archive if it exists
          rm -f /tmp/ollama-darwin.tgz || true
          rm -rf /tmp/ollama || true

          # Remove Rust registry cache (large)
          rm -rf ~/.cargo/registry/cache || true
          rm -rf ~/.cargo/git/checkouts || true

          # Remove debug symbols and other unnecessary files from target
          find desktop/src-tauri/target -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          find desktop/src-tauri/target -name "*.pdb" -delete 2>/dev/null || true

          echo "Disk space after cleanup:"
          df -h

      - name: Sign and Notarize macOS App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Find the .app bundle
          APP_PATH=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find desktop/src-tauri/target/release/bundle/macos -name "*.app" 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app bundle"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          # Get the signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Error: Could not find Developer ID Application certificate"
            exit 1
          fi

          echo "Signing with identity: $SIGNING_IDENTITY"

          # Sign all nested components first (frameworks, dylibs, etc.)
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) -exec codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp {} \; 2>/dev/null || true

          # Sign any nested .app bundles
          find "$APP_PATH" -name "*.app" -type d -mindepth 1 -exec codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp --deep {} \; 2>/dev/null || true

          # Sign the main app bundle
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp --deep "$APP_PATH"

          # Verify the signature
          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          # Create a ZIP for notarization
          echo "Creating ZIP for notarization..."
          ZIP_PATH="$RUNNER_TEMP/app-for-notarization.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          # Submit for notarization
          echo "Submitting for notarization..."
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          # Staple the notarization ticket to the app
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"

          # Verify stapling
          echo "Verifying stapled app..."
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vvv "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Create signed DMG
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          OUTPUT_DIR="release-artifacts"
          mkdir -p $OUTPUT_DIR

          DMG_NAME="${{ env.APP_NAME }}-macOS-${{ matrix.artifact_suffix }}.dmg"
          DMG_PATH="$OUTPUT_DIR/$DMG_NAME"

          # Get the signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')

          # Create DMG from the signed app
          echo "Creating DMG..."
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"

          # Sign the DMG
          echo "Signing DMG..."
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG_PATH"

          # Notarize the DMG
          echo "Notarizing DMG..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait

          # Staple the DMG
          echo "Stapling DMG..."
          xcrun stapler staple "$DMG_PATH"

          echo "Final artifacts:"
          ls -la $OUTPUT_DIR

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.artifact_suffix }}
          path: release-artifacts/*

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AI Goodbye v${{ steps.version.outputs.version }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | macOS | Apple Silicon | [AIGoodbye-macOS-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-macOS-arm64.dmg) |
            | macOS | Intel | [AIGoodbye-macOS-x64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-macOS-x64.dmg) |
            | Windows | 64-bit | [AIGoodbye-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-Windows-Setup.exe) |
            | Windows | GPU Acceleration | [AIGoodbye-GPU-Runners.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AIGoodbye-GPU-Runners.zip) |

            ## Installation

            **macOS:** Download the DMG file for your Mac type, open it, and drag AI Goodbye to your Applications folder.

            **Windows:** Download the Setup.exe and run the installer.

            ## GPU Acceleration (Windows)

            The Windows installer includes CPU support out of the box. If you have an NVIDIA or AMD GPU, the app will offer to download GPU acceleration on first launch for faster AI responses.

            ## What's New
