name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle Python backend
        working-directory: desktop
        run: npm run bundle:python

      - name: Build Tauri
        working-directory: desktop
        run: npm run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Add Rust targets for universal binary
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Bundle Python backend (arm64)
        working-directory: desktop
        run: npm run bundle:python

      - name: Build Tauri (arm64)
        working-directory: desktop
        run: npm run build:mac-arm

      - name: Bundle Python backend (x86_64)
        working-directory: desktop
        env:
          ARCHFLAGS: "-arch x86_64"
        run: |
          # Rebuild for Intel
          cd desktop
          npm run bundle:python

      - name: Build Tauri (x86_64)
        working-directory: desktop
        run: npm run build:mac-intel

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-installer/*
            macos-installer/*
          draft: true
          generate_release_notes: true
