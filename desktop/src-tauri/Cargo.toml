[package]
name = "banana-ai-desktop"
version = "1.0.0"
description = "Banana AI - Your Offline AI with Internet Connectivity"
authors = ["AI Goodbye <marketing@dealerofhappiness.com>"]
edition = "2021"
license = "Proprietary"
homepage = "https://aigoodbye.ai"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
